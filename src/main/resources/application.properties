# Application Configuration
spring.application.name=FestPass

# Server Configuration
server.port=8085

# -------------------------------------------------------------
# MySQL Database Configuration (Uncomment & set your MySQL password)
# -------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/college_fest_ticketing?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=YOUR_MYSQL_PASSWORD_HERE
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------
# H2 In-Memory Database (Active for instant out-of-the-box execution)
# -------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:festpassdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# OpenAPI / Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.com.festpass=DEBUG
